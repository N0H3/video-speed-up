<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 200px;
            padding: 15px;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
        }

        h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-on {
            background-color: #4caf50;
            color: white;
        }

        .btn-on:hover {
            background-color: #45a049;
        }

        .btn-off {
            background-color: #f44336;
            color: white;
        }

        .btn-off:hover {
            background-color: #d32f2f;
        }

        #status {
            margin-bottom: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <h3>Video Speed Control</h3>
    <div id="status">Загрузка...</div>
    <button id="toggleBtn" class="btn-on">ВКЛЮЧИТЬ</button>
</body>
<script src="popup.js"></script>

</html>
